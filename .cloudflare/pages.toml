[build]
command = "npm run compile-web"
output_directory = "out-build"

[build.environment]
NODE_VERSION = "18"
NPM_VERSION = "9"

[build.environment.VSCODE_WEB_ENABLE_EXTENSIONS]
value = "true"

[build.environment.VSCODE_WEB_ENABLE_FILE_SYSTEM]
value = "true"

[build.environment.VSCODE_WEB_ENABLE_WORKBENCH]
value = "true"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[headers]
"/*" = [
  "X-Frame-Options: DENY",
  "X-Content-Type-Options: nosniff",
  "Referrer-Policy: strict-origin-when-cross-origin"
]

"/*.js" = [
  "Cache-Control: public, max-age=31536000, immutable"
]

"/*.css" = [
  "Cache-Control: public, max-age=31536000, immutable"
]

"/*.svg" = [
  "Cache-Control: public, max-age=31536000, immutable"
]

"/*.png" = [
  "Cache-Control: public, max-age=31536000, immutable"
]

"service-worker.js" = [
  "Cache-Control: no-cache"
]

"manifest.json" = [
  "Cache-Control: public, max-age=3600"
]