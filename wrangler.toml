# Cloudflare Pages Configuration for VS Code Web
# إعداد Cloudflare Pages لـ VS Code Web

# Required for Cloudflare Pages
pages_build_output_dir = "out-build"

# Project name
name = "vscode-web-optimized"

# Compatibility settings
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Build configuration - use standalone script that doesn't require npm
[build]
command = "node build-standalone.js"