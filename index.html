<!DOCTYPE html>
<html lang="en" style="width: 100%; height: 100%;">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
	<meta name="theme-color" content="#007acc">
	<meta name="description" content="VS Code Web - Optimized for Cloudflare Pages with responsive design for all devices">
	<meta name="keywords" content="VS Code, Web Editor, Cloudflare Pages, Responsive Design">
	<meta name="author" content="VS Code Team">
	
	<!-- Cloudflare Pages Optimizations -->
	<meta http-equiv="X-Content-Type-Options" content="nosniff">
	<meta http-equiv="X-Frame-Options" content="DENY">
	<meta http-equiv="X-XSS-Protection" content="1; mode=block">
	
	<!-- PWA Support -->
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="VS Code Web">
	
	<!-- Preload critical resources -->
	<link rel="preload" href="./vs/loader.js" as="script">
	<link rel="preload" href="./vs/workbench/workbench.web.main.js" as="script">
	
	<!-- Favicon -->
	<link rel="icon" type="image/svg+xml" href="./vs/workbench/browser/media/code-icon.svg">
	<link rel="apple-touch-icon" href="./vs/workbench/browser/media/code-icon.svg">
	
	<!-- PWA Manifest -->
	<link rel="manifest" href="./manifest.json">
	
	<title>VS Code Web - Cloudflare Pages</title>
	
	<style>
		/* Critical CSS for initial load */
		html, body {
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
			overflow: hidden;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
		}
		
		/* Loading screen */
		#loading {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: #1e1e1e;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			color: #cccccc;
			z-index: 9999;
			transition: opacity 0.3s ease;
		}
		
		#loading.hidden {
			opacity: 0;
			pointer-events: none;
		}
		
		.loading-spinner {
			width: 40px;
			height: 40px;
			border: 3px solid #333333;
			border-top: 3px solid #007acc;
			border-radius: 50%;
			animation: spin 1s linear infinite;
			margin-bottom: 20px;
		}
		
		@keyframes spin {
			0% { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}
		
		.loading-text {
			font-size: 16px;
			margin-bottom: 10px;
		}
		
		.loading-subtext {
			font-size: 14px;
			color: #888888;
		}
		
		/* Responsive loading screen */
		@media (max-width: 480px) {
			.loading-spinner {
				width: 30px;
				height: 30px;
				border-width: 2px;
			}
			
			.loading-text {
				font-size: 14px;
			}
			
			.loading-subtext {
				font-size: 12px;
			}
		}
		
		/* VS Code Web Interface */
		#vscode-workbench {
			width: 100%;
			height: 100%;
			background: #1e1e1e;
			color: #cccccc;
			display: flex;
			flex-direction: column;
		}
		
		/* VS Code Header */
		.vscode-header {
			background: #2d2d30;
			border-bottom: 1px solid #3c3c3c;
			padding: 8px 16px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			font-size: 13px;
		}
		
		.vscode-title {
			color: #007acc;
			font-weight: 600;
		}
		
		.vscode-menu {
			display: flex;
			gap: 16px;
		}
		
		.vscode-menu-item {
			color: #cccccc;
			cursor: pointer;
			padding: 4px 8px;
			border-radius: 3px;
			transition: background-color 0.2s;
		}
		
		.vscode-menu-item:hover {
			background: #3c3c3c;
		}
		
		/* VS Code Sidebar */
		.vscode-sidebar {
			background: #252526;
			width: 250px;
			border-right: 1px solid #3c3c3c;
			display: flex;
			flex-direction: column;
		}
		
		.vscode-sidebar-header {
			padding: 8px 12px;
			font-size: 11px;
			font-weight: 600;
			color: #bbbbbb;
			text-transform: uppercase;
			letter-spacing: 0.5px;
			border-bottom: 1px solid #3c3c3c;
		}
		
		.vscode-sidebar-content {
			flex: 1;
			padding: 8px 0;
		}
		
		.vscode-sidebar-item {
			padding: 6px 12px;
			cursor: pointer;
			display: flex;
			align-items: center;
			gap: 8px;
			font-size: 13px;
		}
		
		.vscode-sidebar-item:hover {
			background: #2a2d2e;
		}
		
		.vscode-sidebar-item.active {
			background: #37373d;
		}
		
		/* VS Code Main Area */
		.vscode-main {
			flex: 1;
			display: flex;
			flex-direction: column;
		}
		
		.vscode-editor {
			flex: 1;
			background: #1e1e1e;
			display: flex;
			align-items: center;
			justify-content: center;
			flex-direction: column;
			padding: 40px;
			text-align: center;
		}
		
		.vscode-editor-icon {
			font-size: 64px;
			margin-bottom: 20px;
			color: #007acc;
		}
		
		.vscode-editor-title {
			font-size: 24px;
			font-weight: 600;
			margin-bottom: 12px;
			color: #cccccc;
		}
		
		.vscode-editor-subtitle {
			font-size: 14px;
			color: #888888;
			margin-bottom: 24px;
		}
		
		.vscode-button {
			background: #007acc;
			color: white;
			border: none;
			padding: 8px 16px;
			border-radius: 3px;
			cursor: pointer;
			font-size: 13px;
			transition: background-color 0.2s;
		}
		
		.vscode-button:hover {
			background: #005a9e;
		}
		
		/* Responsive Design */
		@media (max-width: 768px) {
			.vscode-sidebar {
				width: 200px;
			}
			
			.vscode-editor {
				padding: 20px;
			}
			
			.vscode-editor-icon {
				font-size: 48px;
			}
			
			.vscode-editor-title {
				font-size: 20px;
			}
		}
		
		@media (max-width: 480px) {
			.vscode-sidebar {
				width: 100%;
				height: auto;
				border-right: none;
				border-bottom: 1px solid #3c3c3c;
			}
			
			#vscode-workbench {
				flex-direction: column;
			}
			
			.vscode-editor {
				padding: 16px;
			}
			
			.vscode-editor-icon {
				font-size: 40px;
			}
			
			.vscode-editor-title {
				font-size: 18px;
			}
		}
	</style>
</head>

<body>
	<!-- Loading Screen -->
	<div id="loading">
		<div class="loading-spinner"></div>
		<div class="loading-text">جاري تحميل VS Code Web...</div>
		<div class="loading-subtext">Loading VS Code Web...</div>
	</div>

	<!-- Main Application Container -->
	<div id="vscode-workbench">
		<!-- VS Code Header -->
		<div class="vscode-header">
			<div class="vscode-title">VS Code Web</div>
			<div class="vscode-menu">
				<div class="vscode-menu-item">File</div>
				<div class="vscode-menu-item">Edit</div>
				<div class="vscode-menu-item">View</div>
				<div class="vscode-menu-item">Help</div>
			</div>
		</div>
		
		<!-- VS Code Main Content -->
		<div style="display: flex; flex: 1;">
			<!-- VS Code Sidebar -->
			<div class="vscode-sidebar">
				<div class="vscode-sidebar-header">Explorer</div>
				<div class="vscode-sidebar-content">
					<div class="vscode-sidebar-item active">
						📁 Open Folder
					</div>
					<div class="vscode-sidebar-item">
						📄 New File
					</div>
					<div class="vscode-sidebar-item">
						🔍 Search
					</div>
					<div class="vscode-sidebar-item">
						🔧 Extensions
					</div>
				</div>
			</div>
			
			<!-- VS Code Main Area -->
			<div class="vscode-main">
				<div class="vscode-editor">
					<div class="vscode-editor-icon">💻</div>
					<div class="vscode-editor-title">VS Code Web</div>
					<div class="vscode-editor-subtitle">Ready to code on any device</div>
					<button class="vscode-button" onclick="openFolder()">Open Folder</button>
				</div>
			</div>
		</div>
	</div>

	<script>
		// Cloudflare Pages specific optimizations
		(function() {
			'use strict';
			
			// Performance monitoring
			const startTime = performance.now();
			
			// Check for service worker support
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', function() {
					navigator.serviceWorker.register('./service-worker.js')
						.then(function(registration) {
							console.log('ServiceWorker registration successful');
						})
						.catch(function(err) {
							console.log('ServiceWorker registration failed');
						});
				});
			}
			
			// Responsive viewport handling
			function updateViewport() {
				const viewport = document.querySelector('meta[name=viewport]');
				const isMobile = window.innerWidth <= 768;
				
				if (isMobile) {
					viewport.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover');
				} else {
					viewport.setAttribute('content', 'width=device-width, initial-scale=1.0');
				}
			}
			
			// Update viewport on resize
			window.addEventListener('resize', updateViewport);
			updateViewport();
			
			// Loading progress
			let loadingProgress = 0;
			const loadingInterval = setInterval(function() {
				loadingProgress += Math.random() * 15;
				if (loadingProgress >= 90) {
					clearInterval(loadingInterval);
				}
			}, 100);
			
			// Hide loading screen when app is ready
			function hideLoading() {
				const loading = document.getElementById('loading');
				loading.classList.add('hidden');
				setTimeout(function() {
					loading.style.display = 'none';
				}, 300);
			}
			
			// Error handling
			window.addEventListener('error', function(e) {
				console.error('Application error:', e.error);
				hideLoading();
			});
			
			// Performance logging
			window.addEventListener('load', function() {
				const loadTime = performance.now() - startTime;
				console.log(`VS Code Web loaded in ${loadTime.toFixed(2)}ms`);
				
				// Hide loading screen after a short delay
				setTimeout(hideLoading, 1000);
			});
			
			// Expose hideLoading for VS Code to call
			window.hideVSLoading = hideLoading;
			
			// VS Code Web functions
			window.openFolder = function() {
				alert('VS Code Web is ready! This is a demo interface optimized for Cloudflare Pages.');
			};
			
		})();
	</script>

	<!-- VS Code Loader (fallback) -->
	<script>
		// VS Code Web Configuration
		var require = {
			paths: {
				'vs': './vs'
			}
		};
		
		// Try to load VS Code Web, but don't fail if files are missing
		try {
			// Load VS Code Web
			require(['vs/workbench/workbench.web.main'], function() {
				// VS Code is loaded, hide loading screen
				if (window.hideVSLoading) {
					window.hideVSLoading();
				}
			}, function(error) {
				// VS Code failed to load, but we have a fallback interface
				console.log('VS Code Web files not available, using fallback interface');
				if (window.hideVSLoading) {
					window.hideVSLoading();
				}
			});
		} catch (error) {
			// Fallback if require is not available
			console.log('VS Code Web loader not available, using fallback interface');
			if (window.hideVSLoading) {
				window.hideVSLoading();
			}
		}
	</script>
</body>

</html>
