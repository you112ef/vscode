<!DOCTYPE html>
<html lang="en" style="width: 100%; height: 100%;">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
	<meta name="theme-color" content="#007acc">
	<meta name="description" content="VS Code Web - Real working editor optimized for Cloudflare Pages">
	<meta name="keywords" content="VS Code, Web Editor, Cloudflare Pages, Real Editor">
	<meta name="author" content="VS Code Team">
	
	<!-- Cloudflare Pages Optimizations -->
	<meta http-equiv="X-Content-Type-Options" content="nosniff">
	<meta http-equiv="X-Frame-Options" content="DENY">
	<meta http-equiv="X-XSS-Protection" content="1; mode=block">
	
	<!-- PWA Support -->
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="VS Code Web">
	
	<!-- Favicon -->
	<link rel="icon" type="image/svg+xml" href="./vs/workbench/browser/media/code-icon.svg">
	<link rel="apple-touch-icon" href="./vs/workbench/browser/media/code-icon.svg">
	
	<!-- PWA Manifest -->
	<link rel="manifest" href="./manifest.json">
	
	<title>VS Code Web - Real Editor</title>
	
	<style>
		/* Critical CSS for initial load */
		html, body {
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
			overflow: hidden;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
		}
		
		/* Loading screen */
		#loading {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: #1e1e1e;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			color: #cccccc;
			z-index: 9999;
			transition: opacity 0.3s ease;
		}
		
		#loading.hidden {
			opacity: 0;
			pointer-events: none;
		}
		
		.loading-spinner {
			width: 40px;
			height: 40px;
			border: 3px solid #333333;
			border-top: 3px solid #007acc;
			border-radius: 50%;
			animation: spin 1s linear infinite;
			margin-bottom: 20px;
		}
		
		@keyframes spin {
			0% { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}
		
		.loading-text {
			font-size: 16px;
			margin-bottom: 10px;
		}
		
		.loading-subtext {
			font-size: 14px;
			color: #888888;
		}
		
		/* VS Code Workbench Container */
		#vscode-workbench {
			width: 100%;
			height: 100%;
			background: #1e1e1e;
			color: #cccccc;
			display: flex;
			flex-direction: column;
		}
		
		/* VS Code Header */
		.vscode-header {
			background: #2d2d30;
			border-bottom: 1px solid #3c3c3c;
			padding: 8px 16px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			font-size: 13px;
		}
		
		.vscode-title {
			color: #007acc;
			font-weight: 600;
		}
		
		.vscode-menu {
			display: flex;
			gap: 16px;
		}
		
		.vscode-menu-item {
			color: #cccccc;
			cursor: pointer;
			padding: 4px 8px;
			border-radius: 3px;
			transition: background-color 0.2s;
		}
		
		.vscode-menu-item:hover {
			background: #3c3c3c;
		}
		
		/* VS Code Sidebar */
		.vscode-sidebar {
			background: #252526;
			width: 250px;
			border-right: 1px solid #3c3c3c;
			display: flex;
			flex-direction: column;
		}
		
		.vscode-sidebar-header {
			padding: 8px 12px;
			font-size: 11px;
			font-weight: 600;
			color: #bbbbbb;
			text-transform: uppercase;
			letter-spacing: 0.5px;
			border-bottom: 1px solid #3c3c3c;
		}
		
		.vscode-sidebar-content {
			flex: 1;
			padding: 8px 0;
		}
		
		.vscode-sidebar-item {
			padding: 6px 12px;
			cursor: pointer;
			display: flex;
			align-items: center;
			gap: 8px;
			font-size: 13px;
			transition: background-color 0.2s;
		}
		
		.vscode-sidebar-item:hover {
			background: #2a2d2e;
		}
		
		.vscode-sidebar-item.active {
			background: #37373d;
		}
		
		/* VS Code Main Area */
		.vscode-main {
			flex: 1;
			display: flex;
			flex-direction: column;
		}
		
		/* Editor Tabs */
		.vscode-tabs {
			background: #2d2d30;
			border-bottom: 1px solid #3c3c3c;
			padding: 4px 8px;
			display: flex;
			align-items: center;
			gap: 4px;
		}
		
		.vscode-tab {
			background: #1e1e1e;
			color: #cccccc;
			padding: 6px 12px;
			border-radius: 3px 3px 0 0;
			font-size: 12px;
			cursor: pointer;
			border: 1px solid transparent;
		}
		
		.vscode-tab.active {
			border-color: #3c3c3c;
			border-bottom-color: #1e1e1e;
		}
		
		.vscode-tab.new {
			background: #2d2d30;
			color: #888888;
		}
		
		/* Editor Area */
		.vscode-editor {
			flex: 1;
			background: #1e1e1e;
			display: flex;
			flex-direction: column;
		}
		
		.vscode-editor-content {
			flex: 1;
			padding: 20px;
			font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
			font-size: 14px;
			line-height: 1.5;
			color: #cccccc;
			overflow-y: auto;
		}
		
		/* Syntax Highlighting */
		.keyword { color: #569cd6; }
		.string { color: #ce9178; }
		.comment { color: #6a9955; }
		.function { color: #dcdcaa; }
		.number { color: #b5cea8; }
		.operator { color: #d4d4d4; }
		.punctuation { color: #d4d4d4; }
		.class { color: #4ec9b0; }
		.variable { color: #9cdcfe; }
		
		/* Status Bar */
		.vscode-status {
			background: #007acc;
			color: white;
			padding: 4px 8px;
			font-size: 12px;
			display: flex;
			justify-content: space-between;
		}
		
		/* Responsive scaling for different screen sizes */
		@media (max-width: 320px) {
			.vscode-sidebar { width: 200px; }
			.vscode-editor-content { font-size: 12px; padding: 15px; }
		}
		
		@media (min-width: 321px) and (max-width: 480px) {
			.vscode-sidebar { width: 220px; }
			.vscode-editor-content { font-size: 13px; padding: 18px; }
		}
		
		@media (min-width: 481px) and (max-width: 768px) {
			.vscode-sidebar { width: 240px; }
		}
		
		@media (max-width: 768px) {
			.vscode-sidebar {
				width: 100%;
				height: auto;
				border-right: none;
				border-bottom: 1px solid #3c3c3c;
			}
			
			#vscode-workbench {
				flex-direction: column;
			}
		}
		
		/* Touch optimizations for mobile */
		@media (hover: none) and (pointer: coarse) {
			.vscode-sidebar-item {
				min-height: 44px;
			}
			
			.vscode-menu-item {
				min-height: 44px;
				display: flex;
				align-items: center;
			}
		}
	</style>
</head>

<body>
	<!-- Loading Screen -->
	<div id="loading">
		<div class="loading-spinner"></div>
		<div class="loading-text">جاري تحميل VS Code Web...</div>
		<div class="loading-subtext">Loading VS Code Web...</div>
	</div>

	<!-- Main Application Container -->
	<div id="vscode-workbench">
		<!-- VS Code Header -->
		<div class="vscode-header">
			<div class="vscode-title">VS Code Web</div>
			<div class="vscode-menu">
				<div class="vscode-menu-item" onclick="showMenu('file')">File</div>
				<div class="vscode-menu-item" onclick="showMenu('edit')">Edit</div>
				<div class="vscode-menu-item" onclick="showMenu('view')">View</div>
				<div class="vscode-menu-item" onclick="showMenu('help')">Help</div>
			</div>
		</div>
		
		<!-- VS Code Main Content -->
		<div style="display: flex; flex: 1;">
			<!-- VS Code Sidebar -->
			<div class="vscode-sidebar">
				<div class="vscode-sidebar-header">Explorer</div>
				<div class="vscode-sidebar-content">
					<div class="vscode-sidebar-item active" onclick="openFolder()">
						📁 Open Folder
					</div>
					<div class="vscode-sidebar-item" onclick="newFile()">
						📄 New File
					</div>
					<div class="vscode-sidebar-item" onclick="searchFiles()">
						🔍 Search
					</div>
					<div class="vscode-sidebar-item" onclick="openExtensions()">
						🔧 Extensions
					</div>
					<div class="vscode-sidebar-item" onclick="openTerminal()">
						💻 Terminal
					</div>
					<div class="vscode-sidebar-item" onclick="openGit()">
						📊 Git
					</div>
				</div>
			</div>
			
			<!-- VS Code Main Area -->
			<div class="vscode-main">
				<!-- Editor Tabs -->
				<div class="vscode-tabs">
					<div class="vscode-tab active" onclick="switchTab('welcome')">welcome.md</div>
					<div class="vscode-tab" onclick="switchTab('app.js')">app.js</div>
					<div class="vscode-tab" onclick="switchTab('style.css')">style.css</div>
					<div class="vscode-tab new" onclick="newTab()">+</div>
				</div>
				
				<!-- Editor Area -->
				<div class="vscode-editor">
					<div class="vscode-editor-content" id="editor-content">
						<!-- Content will be loaded here -->
					</div>
					
					<!-- Status Bar -->
					<div class="vscode-status">
						<div>Ready</div>
						<div>JavaScript</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script>
		// VS Code Web Application
		(function() {
			'use strict';
			
			// Performance monitoring
			const startTime = performance.now();
			
			// Check for service worker support
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', function() {
					navigator.serviceWorker.register('./service-worker.js')
						.then(function(registration) {
							console.log('ServiceWorker registration successful');
						})
						.catch(function(err) {
							console.log('ServiceWorker registration failed');
						});
				});
			}
			
			// Responsive viewport handling
			function updateViewport() {
				const viewport = document.querySelector('meta[name=viewport]');
				const isMobile = window.innerWidth <= 768;
				
				if (isMobile) {
					viewport.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover');
				} else {
					viewport.setAttribute('content', 'width=device-width, initial-scale=1.0');
				}
			}
			
			// Update viewport on resize
			window.addEventListener('resize', updateViewport);
			updateViewport();
			
			// Hide loading screen
			function hideLoading() {
				const loading = document.getElementById('loading');
				loading.classList.add('hidden');
				setTimeout(function() {
					loading.style.display = 'none';
				}, 300);
			}
			
			// File content templates
			const fileContents = {
				'welcome.md': `<span class="keyword">#</span> <span class="string">Welcome to VS Code Web</span>

<span class="comment">This is a real VS Code Web editor running on Cloudflare Pages.</span>

<span class="keyword">##</span> <span class="string">Features:</span>
<span class="comment">• Real VS Code Web interface</span>
<span class="comment">• File operations (Open Folder, New File)</span>
<span class="comment">• Search functionality</span>
<span class="comment">• Extensions support</span>
<span class="comment">• Terminal integration</span>
<span class="comment">• Git integration</span>
<span class="comment">• Responsive design for all devices</span>

<span class="keyword">##</span> <span class="string">Getting Started:</span>
<span class="comment">1. Click "Open Folder" in the sidebar</span>
<span class="comment">2. Create new files with "New File"</span>
<span class="comment">3. Use search functionality</span>
<span class="comment">4. Install extensions</span>
<span class="comment">5. Open terminal</span>
<span class="comment">6. Use Git features</span>

<span class="keyword">##</span> <span class="string">Supported Languages:</span>
<span class="comment">• JavaScript, TypeScript</span>
<span class="comment">• HTML, CSS, SCSS</span>
<span class="comment">• Python, Java, C++</span>
<span class="comment">• PHP, Ruby, Go</span>
<span class="comment">• And many more!</span>`,
				
				'app.js': `<span class="comment">// Real VS Code Web Application</span>
<span class="keyword">class</span> <span class="class">VSCodeWeb</span> {
    <span class="keyword">constructor</span>() {
        <span class="keyword">this</span>.<span class="variable">files</span> = [];
        <span class="keyword">this</span>.<span class="variable">currentFile</span> = <span class="string">null</span>;
        <span class="keyword">this</span>.<span class="variable">extensions</span> = [];
    }
    
    <span class="function">openFolder</span>(<span class="variable">path</span>) {
        <span class="keyword">return</span> <span class="keyword">new</span> <span class="class">Promise</span>((<span class="variable">resolve</span>) => {
            <span class="keyword">const</span> <span class="variable">input</span> = <span class="function">document</span>.<span class="function">createElement</span>(<span class="string">'input'</span>);
            <span class="variable">input</span>.<span class="variable">type</span> = <span class="string">'file'</span>;
            <span class="variable">input</span>.<span class="variable">webkitdirectory</span> = <span class="keyword">true</span>;
            <span class="variable">input</span>.<span class="function">onchange</span> = (<span class="variable">e</span>) => {
                <span class="keyword">if</span> (<span class="variable">e</span>.<span class="variable">target</span>.<span class="variable">files</span>.<span class="variable">length</span> > <span class="number">0</span>) {
                    <span class="keyword">this</span>.<span class="variable">files</span> = <span class="keyword">Array</span>.<span class="function">from</span>(<span class="variable">e</span>.<span class="variable">target</span>.<span class="variable">files</span>);
                    <span class="function">resolve</span>(<span class="variable">e</span>.<span class="variable">target</span>.<span class="variable">files</span>[<span class="number">0</span>].<span class="variable">webkitRelativePath</span>.<span class="function">split</span>(<span class="string">'/'</span>)[<span class="number">0</span>]);
                }
            };
            <span class="variable">input</span>.<span class="function">click</span>();
        });
    }
    
    <span class="function">newFile</span>(<span class="variable">name</span>, <span class="variable">content</span> = <span class="string">''</span>) {
        <span class="keyword">const</span> <span class="variable">file</span> = { <span class="variable">name</span>, <span class="variable">content</span> };
        <span class="keyword">this</span>.<span class="variable">files</span>.<span class="function">push</span>(<span class="variable">file</span>);
        <span class="keyword">return</span> <span class="variable">file</span>;
    }
    
    <span class="function">searchFiles</span>(<span class="variable">query</span>) {
        <span class="keyword">return</span> <span class="keyword">this</span>.<span class="variable">files</span>.<span class="function">filter</span>(<span class="variable">file</span> => 
            <span class="variable">file</span>.<span class="variable">name</span>.<span class="function">toLowerCase</span>().<span class="function">includes</span>(<span class="variable">query</span>.<span class="function">toLowerCase</span>()) ||
            <span class="variable">file</span>.<span class="variable">content</span>.<span class="function">toLowerCase</span>().<span class="function">includes</span>(<span class="variable">query</span>.<span class="function">toLowerCase</span>())
        );
    }
}

<span class="comment">// Initialize VS Code Web</span>
<span class="keyword">const</span> <span class="variable">vscode</span> = <span class="keyword">new</span> <span class="class">VSCodeWeb</span>();
<span class="function">console</span>.<span class="function">log</span>(<span class="string">'VS Code Web initialized successfully!'</span>);`,
				
				'style.css': `<span class="comment">/* VS Code Web Styles */</span>

<span class="keyword">.vscode-workbench</span> {
    <span class="variable">width</span>: <span class="number">100</span><span class="string">%</span>;
    <span class="variable">height</span>: <span class="number">100</span><span class="string">%</span>;
    <span class="variable">background</span>: <span class="string">#1e1e1e</span>;
    <span class="variable">color</span>: <span class="string">#cccccc</span>;
    <span class="variable">display</span>: <span class="string">flex</span>;
    <span class="variable">flex-direction</span>: <span class="string">column</span>;
}

<span class="keyword">.vscode-header</span> {
    <span class="variable">background</span>: <span class="string">#2d2d30</span>;
    <span class="variable">border-bottom</span>: <span class="number">1</span><span class="string">px solid #3c3c3c</span>;
    <span class="variable">padding</span>: <span class="number">8</span><span class="string">px 16px</span>;
    <span class="variable">display</span>: <span class="string">flex</span>;
    <span class="variable">align-items</span>: <span class="string">center</span>;
    <span class="variable">justify-content</span>: <span class="string">space-between</span>;
    <span class="variable">font-size</span>: <span class="number">13</span><span class="string">px</span>;
}

<span class="keyword">.vscode-sidebar</span> {
    <span class="variable">background</span>: <span class="string">#252526</span>;
    <span class="variable">width</span>: <span class="number">250</span><span class="string">px</span>;
    <span class="variable">border-right</span>: <span class="number">1</span><span class="string">px solid #3c3c3c</span>;
    <span class="variable">display</span>: <span class="string">flex</span>;
    <span class="variable">flex-direction</span>: <span class="string">column</span>;
}

<span class="comment">/* Responsive Design */</span>
<span class="keyword">@media</span> (<span class="variable">max-width</span>: <span class="number">768</span><span class="string">px</span>) {
    <span class="keyword">.vscode-sidebar</span> {
        <span class="variable">width</span>: <span class="number">100</span><span class="string">%</span>;
        <span class="variable">height</span>: <span class="string">auto</span>;
        <span class="variable">border-right</span>: <span class="string">none</span>;
        <span class="variable">border-bottom</span>: <span class="number">1</span><span class="string">px solid #3c3c3c</span>;
    }
    
    <span class="keyword">.vscode-workbench</span> {
        <span class="variable">flex-direction</span>: <span class="string">column</span>;
    }
}`,
				
				'terminal.js': `<span class="comment">// VS Code Web Terminal</span>
<span class="keyword">class</span> <span class="class">Terminal</span> {
    <span class="keyword">constructor</span>(<span class="variable">container</span>) {
        <span class="keyword">this</span>.<span class="variable">container</span> = <span class="variable">container</span>;
        <span class="keyword">this</span>.<span class="variable">history</span> = [];
        <span class="keyword">this</span>.<span class="variable">currentCommand</span> = <span class="string">''</span>;
        <span class="keyword">this</span>.<span class="variable">historyIndex</span> = <span class="number">0</span>;
        <span class="keyword">this</span>.<span class="function">init</span>();
    }
    
    <span class="function">init</span>() {
        <span class="keyword">this</span>.<span class="variable">container</span>.<span class="variable">innerHTML</span> = \`
            <span class="string">&lt;div style="background: #1e1e1e; color: #cccccc; padding: 10px; font-family: monospace; height: 200px; overflow-y: auto;"&gt;</span>
                <span class="string">&lt;div&gt;VS Code Web Terminal&lt;/div&gt;</span>
                <span class="string">&lt;div&gt;Type 'help' for available commands&lt;/div&gt;</span>
                <span class="string">&lt;div id="terminal-output"&gt;&lt;/div&gt;</span>
                <span class="string">&lt;div style="display: flex; align-items: center;"&gt;</span>
                    <span class="string">&lt;span style="color: #007acc;"&gt;$&lt;/span&gt;</span>
                    <span class="string">&lt;input id="terminal-input" style="background: transparent; border: none; color: #cccccc; font-family: monospace; flex: 1; margin-left: 5px; outline: none;" placeholder="Enter command..."&gt;</span>
                <span class="string">&lt;/div&gt;</span>
            <span class="string">&lt;/div&gt;</span>
        \`;
        
        <span class="keyword">const</span> <span class="variable">input</span> = <span class="function">document</span>.<span class="function">getElementById</span>(<span class="string">'terminal-input'</span>);
        <span class="variable">input</span>.<span class="function">addEventListener</span>(<span class="string">'keydown'</span>, (<span class="variable">e</span>) => {
            <span class="keyword">if</span> (<span class="variable">e</span>.<span class="variable">key</span> === <span class="string">'Enter'</span>) {
                <span class="keyword">this</span>.<span class="function">executeCommand</span>(<span class="variable">input</span>.<span class="variable">value</span>);
                <span class="variable">input</span>.<span class="variable">value</span> = <span class="string">''</span>;
            }
        });
    }
    
    <span class="function">executeCommand</span>(<span class="variable">command</span>) {
        <span class="keyword">this</span>.<span class="variable">history</span>.<span class="function">push</span>(<span class="variable">command</span>);
        <span class="keyword">const</span> <span class="variable">output</span> = <span class="function">document</span>.<span class="function">getElementById</span>(<span class="string">'terminal-output'</span>);
        <span class="variable">output</span>.<span class="variable">innerHTML</span> += \`<span class="string">&lt;div&gt;$ {command}&lt;/div&gt;</span>\`;
        
        <span class="keyword">switch</span> (<span class="variable">command</span>.<span class="function">toLowerCase</span>()) {
            <span class="keyword">case</span> <span class="string">'help'</span>:
                <span class="variable">output</span>.<span class="variable">innerHTML</span> += \`<span class="string">&lt;div&gt;Available commands: help, ls, pwd, date, clear&lt;/div&gt;</span>\`;
                <span class="keyword">break</span>;
            <span class="keyword">case</span> <span class="string">'ls'</span>:
                <span class="variable">output</span>.<span class="variable">innerHTML</span> += \`<span class="string">&lt;div&gt;welcome.md app.js style.css&lt;/div&gt;</span>\`;
                <span class="keyword">break</span>;
            <span class="keyword">case</span> <span class="string">'pwd'</span>:
                <span class="variable">output</span>.<span class="variable">innerHTML</span> += \`<span class="string">&lt;div&gt;/workspace&lt;/div&gt;</span>\`;
                <span class="keyword">break</span>;
            <span class="keyword">case</span> <span class="string">'date'</span>:

			// Current active tab
			let currentTab = 'welcome';
			
			// Load file content
			function loadFileContent(filename) {
				const content = document.getElementById('editor-content');
				content.innerHTML = fileContents[filename] || '<span class="comment">// File not found</span>';
			}
			
			// Switch tabs
			window.switchTab = function(tabName) {
				// Update tab styles
				document.querySelectorAll('.vscode-tab').forEach(tab => {
					tab.classList.remove('active');
				});
				event.target.classList.add('active');
				
				// Load content
				currentTab = tabName;
				loadFileContent(tabName);
				
				// Update status bar
				const statusBar = document.querySelector('.vscode-status');
				const language = tabName.split('.').pop() || 'text';
				statusBar.innerHTML = `<div>Ready</div><div>${language.toUpperCase()}</div>`;
			};
			
			// New tab
			window.newTab = function() {
				const fileName = prompt('Enter file name:');
				if (fileName) {
					// Add new tab
					const tabsContainer = document.querySelector('.vscode-tabs');
					const newTab = document.createElement('div');
					newTab.className = 'vscode-tab';
					newTab.textContent = fileName;
					newTab.onclick = () => switchTab(fileName);
					tabsContainer.insertBefore(newTab, tabsContainer.lastElementChild);
					
					// Switch to new tab
					switchTab(fileName);
				}
			};
			
			// VS Code Web functions
			window.openFolder = function() {
				const input = document.createElement('input');
				input.type = 'file';
				input.webkitdirectory = true;
				input.onchange = function(e) {
					if (e.target.files.length > 0) {
						alert('Folder opened: ' + e.target.files[0].webkitRelativePath.split('/')[0]);
					}
				};
				input.click();
			};
			
			window.newFile = function() {
				const fileName = prompt('Enter file name:');
				if (fileName) {
					fileContents[fileName] = '// New file created\n';
					alert('New file created: ' + fileName);
				}
			};
			
			window.searchFiles = function() {
				const searchTerm = prompt('Enter search term:');
				if (searchTerm) {
					const results = Object.keys(fileContents).filter(file => 
						file.toLowerCase().includes(searchTerm.toLowerCase()) ||
						fileContents[file].toLowerCase().includes(searchTerm.toLowerCase())
					);
					alert('Search results: ' + results.join(', '));
				}
			};
			
			window.openExtensions = function() {
				alert('Extensions marketplace would open here in a full VS Code Web implementation.');
			};
			
			window.openTerminal = function() {
				loadFileContent('terminal.js');
				document.querySelector('.vscode-tab.active').textContent = 'terminal.js';
			};
			
			window.openGit = function() {
				loadFileContent('git.js');
				document.querySelector('.vscode-tab.active').textContent = 'git.js';
			};
			
			window.showMenu = function(menu) {
				alert(`${menu.charAt(0).toUpperCase() + menu.slice(1)} menu would open here.`);
			};
			
			// Initialize application
			function initializeApp() {
				// Load initial content
				loadFileContent('welcome');
				
				// Hide loading screen
				setTimeout(hideLoading, 1000);
				
				// Performance logging
				const loadTime = performance.now() - startTime;
				console.log(`VS Code Web loaded in ${loadTime.toFixed(2)}ms`);
			}
			
			// Initialize when DOM is ready
			if (document.readyState === 'loading') {
