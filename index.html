					'app.js': `// Real VS Code Web Application with Monaco Editor
class VSCodeWeb {
    constructor() {
        this.files = [];
        this.currentFile = null;
        this.extensions = [];
        this.editor = null;
    }
    
    async openFolder(path) {
        return new Promise((resolve) => {
            const input = document.createElement('input');
            input.type = 'file';
            input.webkitdirectory = true;
            input.onchange = (e) => {
                if (e.target.files.length > 0) {
                    this.files = Array.from(e.target.files);
                    resolve(e.target.files[0].webkitRelativePath.split('/')[0]);
                }
            };
            input.click();
        });
    }
    
    newFile(name, content = '') {
        const file = { name, content };
        this.files.push(file);
        return file;
    }
    
    searchFiles(query) {
        return this.files.filter(file => 
            file.name.toLowerCase().includes(query.toLowerCase()) ||
            file.content.toLowerCase().includes(query.toLowerCase())
        );
    }
    
    // Real Monaco Editor integration
    setEditor(monacoEditor) {
        this.editor = monacoEditor;
    }
    
    changeLanguage(language) {
        if (this.editor) {
            monaco.editor.setModelLanguage(this.editor.getModel(), language);
        }
    }
}

// Initialize VS Code Web
const vscode = new VSCodeWeb();
console.log('VS Code Web with Monaco Editor initialized successfully!');

// Example usage
vscode.newFile('example.js', 'console.log("Hello from Monaco Editor!");');`,

					'terminal.js': `// VS Code Web Terminal with Monaco Editor
class Terminal {
    constructor(container) {
        this.container = container;
        this.history = [];
        this.currentCommand = '';
        this.historyIndex = 0;
        this.init();
    }
    
    init() {
        this.container.innerHTML = \`
            <div style="background: #1e1e1e; color: #cccccc; padding: 10px; font-family: monospace; height: 200px; overflow-y: auto;">
                <div>VS Code Web Terminal</div>
                <div>Type 'help' for available commands</div>
                <div id="terminal-output"></div>
                <div style="display: flex; align-items: center;">
                    <span style="color: #007acc;">$</span>
                    <input id="terminal-input" style="background: transparent; border: none; color: #cccccc; font-family: monospace; flex: 1; margin-left: 5px; outline: none;" placeholder="Enter command...">
                </div>
            </div>
        \`;
        
        const input = document.getElementById('terminal-input');
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                this.executeCommand(input.value);
                input.value = '';
            }
        });
    }
    
    executeCommand(command) {
        this.history.push(command);
        const output = document.getElementById('terminal-output');
        output.innerHTML += \`<div>$ {command}</div>\`;
        
        switch (command.toLowerCase()) {
            case 'help':
                output.innerHTML += '<div>Available commands: help, ls, pwd, date, clear, editor</div>';
                break;
            case 'ls':
                output.innerHTML += '<div>welcome.md app.js style.css terminal.js</div>';
                break;
            case 'pwd':
                output.innerHTML += '<div>/workspace</div>';
                break;
            case 'date':
                output.innerHTML += \`<div>\${new Date().toString()}</div>\`;
                break;
            case 'clear':
                output.innerHTML = '';
                break;
            case 'editor':
                output.innerHTML += '<div>Monaco Editor is active and ready!</div>';
                break;
            default:
                output.innerHTML += \`<div style="color: #f14c4c;">Command not found: {command}</div>\`;
        }
        
        output.scrollTop = output.scrollHeight;
    }
}

// Initialize terminal
const terminal = new Terminal(document.getElementById('monaco-editor'));`,

			// Initialize file content
			function initializeFileContent() {
				const fileList = ['welcome.md', 'app.js', 'style.css', 'terminal.js', 'git.js'];
				fileList.forEach(file => {
					files[file] = getFileContent(file);
				});
			}
			
			// Switch tabs
			window.switchTab = function(tabName) {
				if (!editor) return;
				
				// Save current content
				if (currentFile) {
					files[currentFile] = editor.getValue();
				}
				
				// Update tab styles
				document.querySelectorAll('.vscode-tab').forEach(tab => {
					tab.classList.remove('active');
				});
				event.target.classList.add('active');
				
				// Load new content
				currentFile = tabName;
				const content = files[tabName] || getFileContent(tabName);
				const language = getLanguageFromFilename(tabName);
				
				// Update editor
				editor.setValue(content);
				monaco.editor.setModelLanguage(editor.getModel(), language);
				
				// Update status bar
				updateStatusBar();
			};
			
			// Get language from filename
			function getLanguageFromFilename(filename) {
				const ext = filename.split('.').pop().toLowerCase();
				const languageMap = {
					'js': 'javascript',
					'ts': 'typescript',
					'html': 'html',
					'css': 'css',
					'scss': 'scss',
					'md': 'markdown',
					'json': 'json',
					'py': 'python',
					'java': 'java',
					'cpp': 'cpp',
					'php': 'php',
					'rb': 'ruby',
					'go': 'go'
				};
				return languageMap[ext] || 'plaintext';
			}
			
			// New tab
			window.newTab = function() {
				const fileName = prompt('Enter file name:');
				if (fileName) {
					// Add new tab
					const tabsContainer = document.querySelector('.vscode-tabs');
					const newTab = document.createElement('div');
					newTab.className = 'vscode-tab';
					newTab.textContent = fileName;
					newTab.onclick = () => switchTab(fileName);
					tabsContainer.insertBefore(newTab, tabsContainer.lastElementChild);
					
					// Initialize file content
					files[fileName] = '// New file created\n';
					
					// Switch to new tab
					switchTab(fileName);
				}
			};
			
			// Update status bar
			function updateStatusBar() {
				const statusBar = document.querySelector('.vscode-status');
				const language = getLanguageFromFilename(currentFile);
				statusBar.innerHTML = `<div>Ready</div><div>${language.toUpperCase()}</div>`;
			}
			
			// VS Code Web functions
			window.openFolder = function() {
				const input = document.createElement('input');
				input.type = 'file';
				input.webkitdirectory = true;
				input.onchange = function(e) {
					if (e.target.files.length > 0) {
						alert('Folder opened: ' + e.target.files[0].webkitRelativePath.split('/')[0]);
					}
				};
				input.click();
			};
			
			window.newFile = function() {
				const fileName = prompt('Enter file name:');
				if (fileName) {
					files[fileName] = '// New file created\n';
					alert('New file created: ' + fileName);
				}
			};
			
			window.searchFiles = function() {
				const searchTerm = prompt('Enter search term:');
				if (searchTerm) {
					const results = Object.keys(files).filter(file => 
						file.toLowerCase().includes(searchTerm.toLowerCase()) ||
						files[file].toLowerCase().includes(searchTerm.toLowerCase())
					);
					alert('Search results: ' + results.join(', '));
				}
			};
			
			window.openExtensions = function() {
				alert('Extensions marketplace would open here in a full VS Code Web implementation.');
			};
			
			window.openTerminal = function() {
				switchTab('terminal.js');
			};
			
			window.openGit = function() {
				switchTab('git.js');
			};
			
			window.openSettings = function() {
				alert('Settings panel would open here.');
			};
			
			window.showMenu = function(menu) {
				alert(`${menu.charAt(0).toUpperCase() + menu.slice(1)} menu would open here.`);
			};
			
			// File explorer functions
			window.closeFileExplorer = function() {
				document.getElementById('file-explorer').classList.remove('show');
				fileExplorerOpen = false;
			};
			
			// Initialize application
			function initializeApp() {
				// Initialize Monaco Editor
				initializeMonacoEditor();
			}
			
			// Initialize when DOM is ready
			if (document.readyState === 'loading') {
				document.addEventListener('DOMContentLoaded', initializeApp);
			} else {
				initializeApp();
			}
			
		})();
