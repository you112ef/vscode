name: Prevent package-lock.json changes in PRs

on: 
  pull_request:
    paths:
      - '**'

permissions:
  contents: read
  pull-requests: read

jobs:
  main:
    name: Prevent package-lock.json changes in PRs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for lockfile changes
        uses: dorny/paths-filter@v3
        id: lockfile_changes
        with:
          filters: |
            lockfiles:
              - 'package-lock.json'
              - '**/package-lock.json'
              - 'Cargo.lock'
              - '**/Cargo.lock'

      - name: Prevent Copilot from modifying lockfiles
        if: steps.lockfile_changes.outputs.lockfiles == 'true' && github.event.pull_request.user.login == 'Copilot'
        run: |
          echo "::error::Copilot is not allowed to modify package-lock.json or Cargo.lock files."
          echo "::error::If you need to update dependencies, please do so manually or through authorized means."
          exit 1

      - name: Get user permissions
        uses: octokit/request-action@v2.4.0
        id: get_permissions
        if: steps.lockfile_changes.outputs.lockfiles == 'true' && github.event.pull_request.user.login != 'Copilot'
        with:
          route: GET /repos/${{ github.repository }}/collaborators/{username}/permission
          username: ${{ github.event.pull_request.user.login }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check user permissions
        id: permission_check
        if: steps.lockfile_changes.outputs.lockfiles == 'true' && github.event.pull_request.user.login != 'Copilot'
        run: |
          user="${{ github.event.pull_request.user.login }}"
          role="${{ fromJson(steps.get_permissions.outputs.data).permission }}"
          is_dependabot=${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
          
          echo "User: $user"
          echo "Role: $role"
          echo "Is Dependabot: $is_dependabot"
          
          # Allow admins, maintainers, writers, and dependabot
          if [[ "$role" == "admin" || "$role" == "maintain" || "$role" == "write" || "$is_dependabot" == "true" ]]; then
            echo "User has sufficient permissions to modify lockfiles"
            echo "should_block=false" >> $GITHUB_OUTPUT
          else
            echo "User does not have sufficient permissions to modify lockfiles"
            echo "should_block=true" >> $GITHUB_OUTPUT
          fi

      - name: Block unauthorized lockfile changes
        if: steps.lockfile_changes.outputs.lockfiles == 'true' && steps.permission_check.outputs.should_block == 'true'
        run: |
          echo "::error::Changes to package-lock.json/Cargo.lock files aren't allowed in PRs from users without write permissions."
          echo "::error::Please ask a maintainer to make these changes, or ensure you have the appropriate repository permissions."
          echo "::error::If this is a dependency update, please use 'npm update' or 'cargo update' commands and commit the changes from a branch with appropriate permissions."
          exit 1

      - name: Success message
        if: steps.lockfile_changes.outputs.lockfiles == 'false'
        run: |
          echo "✅ No lockfile changes detected in this PR."
