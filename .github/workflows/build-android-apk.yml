name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Install dependencies
        run: npm install

      - name: Build React App
        run: npm run build

      - name: Install Capacitor & Copy Web Assets
        run: |
          npx cap sync android
          npx cap copy android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK outputs
        run: |
          mkdir -p apk-output
          
          # Copy release APK if available
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk apk-output/
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk apk-output/app-release.apk
          fi
          
          # Copy debug APK as fallback
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/
          fi
          
          # Create build info
          echo "# VS Code Mobile APK" > apk-output/BUILD_INFO.md
          echo "Build Date: $(date)" >> apk-output/BUILD_INFO.md
          echo "Commit: ${{ github.sha }}" >> apk-output/BUILD_INFO.md
          echo "Branch: ${{ github.ref_name }}" >> apk-output/BUILD_INFO.md
          echo "Build Number: ${{ github.run_number }}" >> apk-output/BUILD_INFO.md
          
          ls -la apk-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.run_number }}
          path: apk-output/
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-output/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          name: "VS Code Mobile ${{ github.ref_name }}"
          body: |
            # 📱 VS Code Mobile for Android
            
            ## Features:
            - ✅ Mobile-optimized interface
            - ✅ Touch-friendly controls  
            - ✅ Dark mode by default
            - ✅ Arabic/RTL support
            - ✅ Responsive design
            
            ## Requirements:
            - Android 7.0+ (API level 24)
            - 100MB free space
            - 2GB RAM
            
            ## Installation:
            1. Download the APK file
            2. Enable "Unknown sources" in Settings
            3. Install the app
            
            **Build Info:**
            - Commit: ${{ github.sha }}
            - Build Date: $(date)
            - Build Number: ${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment PR with APK
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { number: issue_number } = context.issue;
            
            const comment = `
            ## 📱 Android APK Ready!
            
            VS Code Mobile APK has been built successfully! You can download it from the artifacts above.
            
            ### Build Info:
            - **Build Number**: ${{ github.run_number }}
            - **Commit**: ${{ github.sha }}
            - **Branch**: ${{ github.ref_name }}
            
            ### Installation:
            1. Download APK from Artifacts section
            2. Enable "Install from unknown sources" in Android settings
            3. Install and enjoy VS Code on your phone! 🚀
            `;
            
            github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: comment
            });